<!doctype html><html lang="ko" class="location-locked"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>아시아 항공우주 산업전 · The 28th China Hi-Tech Fair</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../location.css"><script src="../venue.js" defer></script><script src="../location.js" defer></script></head><body><noscript>안내를 열려면 자바스크립트와 위치 서비스를 켜 주세요.</noscript><header><div class="w"><a class="h" href="../index.html"><b>The 28th China Hi-Tech Fair</b></a><a href="index.html">공식 안내 한글판</a><a href="schedule.html">행사 일정</a><a href="../index.html#find">기업 찾기</a></div></header><main class="w"><h1>아시아 항공우주 산업전</h1><div class="meta"><a href="index.html#expo">전시·전문전</a><a href="https://www.chtf.com/zhanlanyuzhanshi/syht/" target="_blank" rel="noopener">공식 원문 ↗</a></div><figure><a href="https://www.chtf.com/uploads/allimg/202409/3-24091311060W19.jpg" referrerpolicy="no-referrer" aria-label="원본 이미지 크게 보기"><img src="https://www.chtf.com/uploads/allimg/202409/3-24091311060W19.jpg" alt="" loading="lazy" referrerpolicy="no-referrer"></a><figcaption>원본 이미지</figcaption><details class="img-text" open><summary>사진 속 한글 번역</summary><ul><li>제28회 중국 국제 하이테크 성과 교역회</li><li>THE 28th CHINA HI-TECH FAIR 2026년 11월 26~28일 선전 국제회의전시센터(바오안)</li><li>수급 매칭 · 성과 발표 · 국제 협력 · 산학융합 · 투자·융자 · 첨단 트렌드 · 시장 개척 · 인재 교류</li><li>전문 관람객 45만 명 이상</li><li>전시 면적 40만㎡</li><li>전문 행사 200회 이상</li><li>120개 이상 국가·지역</li></ul></details></figure>
<figure><a href="https://www.chtf.com/uploads/allimg/202607/9-260HQ5042J18.jpg" referrerpolicy="no-referrer" aria-label="원본 이미지 크게 보기"><img src="https://www.chtf.com/uploads/allimg/202607/9-260HQ5042J18.jpg" alt="" loading="lazy" referrerpolicy="no-referrer"></a><figcaption>원본 이미지</figcaption><details class="img-text"><summary>사진 속 한글 번역</summary><ul><li>CHTF 아시아 우주전</li><li>제28회 중국 국제 하이테크 성과 교역회 THE 28th CHINA HI-TECH FAIR</li><li>아시아 항공우주 산업전</li><li>2026년 11월 26~28일 선전 국제회의전시센터(바오안)</li><li>주최: 선전시 인민정부</li><li>주관: 전웨이 국제전시그룹, 선전 전웨이 국제전람</li><li>고교회: 중국 과학기술 제1전시회</li><li>고교회는 국무원 승인을 거쳐 1999년 당시 주룽지 총리가 창설을 발표했고 지금까지 27회 열렸습니다. 국가발전개혁위, 공업정보화부, 과학기술부, 국방과학공업위와 광둥성, 선전시 정부 등이 함께 시작했으며 캔톤페어·수입박람회와 함께 중국 3대 국가급 전시회로 꼽힙니다. &#x27;중국 과학기술 제1전시회&#x27;로 불리는 첨단기술 분야의 대외 개방 창구이자 성과 교류·거래의 핵심 플랫폼입니다.</li><li>• 제27회 고교회 주요 수치</li><li>국가·지역</li><li>전시 면적</li><li>브랜드 참가사</li><li>회 전문 행사</li><li>전문 관람객</li><li>제28회 고교회 아시아 항공우주 산업전</li><li>고교회의 핵심 주제전인 아시아 항공우주 산업전은 세계적 전문 전시회로 20,000㎡ 공간에 중국항천과기, 항천과공, 항공공업, 중국전자, 중국통신신호, 야타이 싱퉁, 중커 싱투 등 300곳 이상의 선도기업이 모여 항공우주 기술 교류와 산업 협력의 중요한 플랫폼이 됐습니다.</li><li>기후 변화와 과학기술 혁명이 맞물린 지금, 우주로 나아가는 일은 인류 발전의 필연이자 미래 경제 구도를 바꾸는 힘입니다. 우주 경제가 빠르게 성장하고 항공·우주 융합이 기술 돌파와 산업 고도화의 핵심 동력이 되고 있습니다. 우주 공학의 뒤에는 10조 위안을 넘는 시장이 있으며 &#x27;우주 강국&#x27; 전략과 함께 큰 전략적 기회가 열리고 있습니다.</li><li>10대 강점</li><li>선전은 항공우주 전시회를 열기에 세계에서 가장 알맞은 곳입니다</li><li>아시아 우주전은 거래 확대, 브랜드 홍보, 투자 유치를 위한 글로벌 플랫폼을 지향합니다. 항공우주 혁신 거점 선전에서 열려 10대 핵심 강점으로 참가사에 전략적 기회와 자원을 제공합니다.</li><li>전략적 위상: 과학기술 강국은 곧 우주 강국이며, 우주 경제 발전은 국가 최상위 전략이자 강국·강군의 필수 요건입니다.</li><li>정책 혜택: 상업 우주가 2년 연속 정부 업무보고에 실렸고 우주 강국 전략이 15차 5개년 계획에 명시돼 업계에 역사적 기회가 왔습니다.</li><li>시장 폭발: 2025년 상업 우주 시장은 2.8조 위안을 넘었고 2030년 7.8조 위안이 예상됩니다. 항공 제조 상장사 시가총액은 5.37조 위안을 넘습니다.</li><li>입지 강점: 웨강아오 대만구는 세계 3대 만구의 하나이고 선전은</li><li>그 중심에 있습니다. 첸하이와 &#x27;일대일로&#x27; 거점을 바탕으로</li><li>세계적 과학기술 도시로서 아시아태평양과 세계를 잇습니다.</li><li>산업 집적: 선전, 광저우, 주하이 중심의 주강삼각주에 항공우주 기업 2만 곳 이상이 모였고 총생산은 1조 위안에 가깝습니다.</li><li>혁신 요소: 하얼빈공대 선전연구원 등 최고 연구기관이 있고 위성항법 단말 산업 규모는 전국 1위이며 세계 최초 육공 일체 지능 커넥티드 시험기지를 갖췄습니다. 핵심 기술 인재 밀도도 전국 선두입니다.</li><li>산업 계획: 선전 &#x27;20+8&#x27; 계획은 항공우주 기술을 중점 미래산업으로 삼아 공간정보, 원격탐사·항법, 장비 제조에 집중하며 기술 혁신과 산업기지 건설을 지원합니다.</li><li>국경 간 협력: 선전과 대만구는 항공우주 산업의 해외 진출 교두보로 세계 투자자 5,000곳 이상이 모이고 10대 군수그룹과 글로벌 바이어를 잇습니다.</li><li>자본 서비스: 선전은 금융·투자 도시로 홍콩거래소와 가깝고 창업판 등 다층 자본시장과 사모기관 1만여 곳을 갖춰 엔젤 투자부터 IPO까지 지원합니다.</li><li>자원 매칭: 로켓, 위성, 단말 응용을 아우르는 핵심 기업 1,000곳 가까이가 모이는 산업 자원 매칭의 중심입니다.</li><li>전시 범위</li><li>》 로켓 기술·장비 구역</li><li>대형 운반 로켓, 소형 상업 로켓, 재사용 로켓 완제품과 발사 제어, 추진 시스템, 분리 장치, 지상 발사 지원 설비, 로켓 시험·총조립 기술, 상업 발사 서비스, 심우주 탐사용 로켓 장비를 전시합니다.</li><li>》 위성·단말 구역: 저궤도 통신위성, 고해상도 원격탐사 위성, 항법 위성, 초소형 위성 등 각종 위성과 위성 플랫폼 핵심 부품, 탑재체, 위성항법 단말, 원격탐사 데이터 수신 장비, 위성통신 단말을 전시합니다.</li><li>》 항공우주 동력 시스템 구역</li><li>로켓 엔진, 항공 엔진, 추력 벡터 제어, 연료 공급 시스템(액체산소·케로신, 액체수소·액체산소, 메탄), 신에너지 동력 솔루션, 엔진 시험·검사 장비, 동력 시스템 정비 기술을 전시합니다.</li><li>》 항공우주 통신·측정제어 구역</li><li>위성항법 시스템, 공천 일체 통신 단말, 고속 데이터링크, 지상 측정제어소, 측정제어 레이더, 데이터 수신·처리 시스템, AI 데이터 분석 플랫폼, 전자전·방호 장비를 전시합니다.</li><li>》 우주 소재·구조 구역</li><li>특수 합금(티타늄, 고온합금, 초고강도강), 첨단 복합재(탄소섬유, 세라믹기, 수지기), 내열 방호 소재, 3D 프린팅 구조물, 경량 날개·동체 부품</li><li>등 기능성 소재와 핵심 구조 부품을 전시합니다.</li><li>지난 참가사</li><li>동시 행사</li><li>베이징의 날개, 대만구의 별</li><li>상업 우주 산업 클러스터 발전과 공급망 혁신</li><li>• 항공우주 성과 전환·산업화 포럼 • 글로벌 구매 매칭 대회 • 글로벌 투자·융자 수급 매칭회</li></ul></details></figure></main><footer><div class="w"><a href="https://www.chtf.com/">공식 사이트</a> · <a href="https://github.com/PKNU-leejihoon/chtf2026-ko-guide/issues">정보 정정</a></div></footer></body></html>
