<figure><a href="https://www.chtf.com/uploads/allimg/202603/3-260312143349648.jpg" referrerpolicy="no-referrer" aria-label="원본 이미지 크게 보기"><img src="https://www.chtf.com/uploads/allimg/202603/3-260312143349648.jpg" alt="" loading="lazy" referrerpolicy="no-referrer"></a><figcaption>원본 이미지</figcaption><details class="img-text"><summary>사진 속 한글 번역</summary><ul><li>제28회 중국 국제 하이테크 성과 교역회 THE 28th CHINA HI-TECH FAIR</li><li>아시아 바이오·화학공학전</li><li>2026년 11월 26~28일 선전 국제회의전시센터(바오안)</li><li>제28회 고교회는 국무원 승인으로 선전시 인민정부가 주최하며 2026년 11월 26~28일 선전 국제회의전시센터에서 열립니다. 전시면적 약 40만㎡에 100여 개 국가·지역의 유명 기업과 국제기구 5,000여 곳이 참가할 예정입니다.</li><li>아시아 바이오·화학공학전(BCE 2026)</li><li>고교회의 핵심 전문 구역인 BCE 2026은 분석·진단, 고급 의료, 실험실 기술, 생화학 기술에 집중하는 권위 있는 전문 전시·산업 홍보 플랫폼입니다.</li><li>국내외 핵심 기업 300곳 이상이 참가할 예정이며 고교회의 120여 개</li><li>국가·지역에서 온 연인원 45만여 명의 전문 관람객 자원을 활용합니다. 대학, 연구기관, 국가중점실험실 100곳 이상이 함께 참가해 산학연 연계와 성과 전환을 돕습니다. 주요 참가 기관은 칭화대, 베이징대, 푸단대, 상하이교통대, 우한대, 저장대, 선전이공대, 선전대, 홍콩중문대, 싱가포르국립대, 중국과학원, 선전만 실험실 등입니다.</li><li>구매 매칭회, 투자·융자 대회, 산업별 주제 회의가 함께 열려 기술 응용과 이론 혁신의 융합을 다룹니다. 미래 과학 실험실, 혁신 신약, ADC 약물, 세포·유전자 치료, 분자진단, AI 기반 분광·영상 분석,</li><li>크로마토그래피 분리 분석, 환경 분석 등의 특별 구역을 두고 국가 부처 전문가와 국내외 업계 리더를 초청합니다. 국가 산업정책과 선전의 산업 클러스터를 바탕으로 고교회·BCE 2026은 첨단 기술, 혁신 성과, 산업 자원을 모아 기술 전시, 산업</li><li>매칭, 성과 전환을 아우르는 전문 플랫폼을 만듭니다.</li><li>실험실 분석·검사 기기: 생화학 분석기, 생명과학 기기, 세포배양 시스템, 생체 영상 시스템, 바이오칩, 분리·정제 시스템, 3D 프린팅</li><li>시료 전처리·제조 기기, 환경·농업 분석기, 광학 기기, 질량분석기, X선 기기, 분광기, 크로마토그래피, 파장분석기, 전기화학 기기, 현미경·영상 분석기, 열분석기, 전자광학 기기, 미생물 검사기, 업종별 전용 기기, 해양 기기, 대기 탐측 기기, 전자 측정기, 물성 시험기, 특수 검사기, 지구 탐사 기기, 계량 기기</li><li>소독·클린룸 설비, 실험실 설계·시공, 실험실 정보관리시스템, 표준물질</li><li>시약: 생화학 시약, 일반 시약, 진단 시약, 고순도 시약, 기타 시약 / 소모품</li><li>유리 기구: 비커, 시험관, 메스실린더, 증류 플라스크, 냉각관, 광구병, 점적병</li><li>플라스틱 제품: 원심관, 배양접시, 피펫 팁, 시약병, 냉동 보관 튜브</li><li>기타: 도가니, 유발, 실리콘·라텍스 튜브, 여과지, pH 시험지</li><li>공학 기술 장비: 발효조, 세포 반응기, 세포배양 설비, 당화 설비, 분리·여과, 추출·정제, 계측기·산업 자동화, 위생급 유체 설비, 환경 기술·장비</li><li>생화학 기술 서비스: 유전자 검사, 줄기세포 기술, 미생물학, 분자생물학, 세포생물학 서비스, 바이오칩 서비스, CRO/CMO, 기술 교육, 면역학 서비스, 인력 서비스, 단백체·대사체학, 바이오 플랫폼 서비스, 검사 서비스, 생물정보학, 신약 개발·생산, 임상연구 서비스</li><li>바이오 제품과 신흥 치료: 재조합 단백질, 펩타이드, 핵산, 백신, 혈액제제, 치료 항체, 세포·유전자 치료, 종양 면역치료, 줄기세포·iPS, 바이오 의약 원료, 원료의약품, 효소, 보조 소재, 첨가제, 안정제, 시험 키트</li><li>의학 검사·IVD</li><li>생화학·면역·분자·미생물·소변·세포 진단과 POCT 분야의 진단 기기, 시약, 보조 기구·용품 / 연구성과 전환과 산학연 협력</li><li>대학, 연구기관, 혁신 기업의 전환 가능한 연구성과, 기술 프로젝트, 산업화</li><li>사례를 집중 전시합니다.</li><li>전문 관람객 자료 | 꾸준히 성장하는 BTE 2025 &gt;&gt;&gt;</li><li>2025 전문 관람객 자료 | 꾸준한 성장</li><li>BCE 2025에는 국내외 연인원 26,517명이 방문했습니다.</li><li>※ 2025년 전시 현장 조사 결과</li><li>방문 목적</li><li>관람객 업종 분포</li><li>관람객 의사결정권 분석</li><li>17.05% 화공·화학</li><li>최종 결정·승인</li><li>기타</li><li>구매 제품, 국내외 협력</li><li>의사결정자에게 정보 제공·추천</li><li>바이오 기술 및</li><li>의료 검사기관</li><li>바이오의약</li><li>구체적 사용 요건 지정</li><li>공급사 교류</li><li>의사결정 범위 밖</li><li>유통사/대리점</li><li>연구기관</li><li>2025년 전시 현장 인터뷰</li><li>국내의 무세포 단백질 발현 시약 전문 기업으로,</li><li>이번에 핵심 제품인 무세포 단백질 발현</li><li>기술 솔루션을 선보였습니다. 바이오의약 초기 연구개발, 합성생물학 산업화 현장에 원스톱 기술 지원과 맞춤 서비스를 제공합니다.</li><li>지금까지 국내 고객 100여 곳을 지원했고 안정적인 기술 성능과 빠른 서비스로 좋은 평판을 쌓았습니다. 이번 고교회에서 핵심 기술과 제품 강점을 보여 주고 시장을 넓혀 더 많은 파트너와 깊이 협력해 업계 혁신에 기여하고자 합니다.</li><li>추이진후이</li><li>박사</li><li>쑤저우 포뤄팅 바이오테크 CEO</li><li>룽다 바이오는 이번이 첫 참가입니다. 관람객과</li><li>참가기업이 이렇게 많아 열기가 대단합니다. 룽다는 2007년 선전 첨단기술</li><li>기업이 됐고 2012년부터 국가 첨단기술기업 인증을 다섯 차례 받았으며 전문화 &#x27;소거인&#x27; 기업으로도 선정됐습니다. 그동안 고교회를 중시하지 못한 것이 아쉽지만 지금이라도 와서 다행입니다. 룽다는 2001년 창립했고 창업의 뜻은</li><li>중국인의 민족 브랜드를 만드는 것이었습니다. 지금은 뷰티에서</li><li>한민 회장</li><li>건강까지 많은 솔루션을 갖췄습니다. 더 좋은 제품을 만들기 위해 노력하겠습니다.</li><li>선전 룽다 바이오테크</li><li>고객의 요구에 맞는 제품을 만들겠습니다.</li><li>이번 전시에서 《세포 &#x27;살아 있는 약&#x27;의 품질 과제와 최신 대응 전략》을 발표하고 후난 위안타이 바이오의 신제품과 신기술을 소개했습니다.</li><li>위안타이 바이오의 사업은 네 부문입니다. 단클론항체 개발·생산·판매·맞춤 서비스와 이중특이항체 개발, 면역세포 공학과 CAR-T·CAR-NK CRO·CDMO, mRNA-LNP CRO·CDMO, 세계 항체 표적·면역치료 특허 라이선스입니다. 여러 상장사와 협력 중이며 이번 전시에서 더 많은 파트너를 만나고자 합니다.</li><li>샹솽린 교수</li><li>후난 위안타이 바이오테크 회장</li><li>고교회 현장에 다시 오게 되어 영광입니다. 올해는 차세대 레이저 광양자 표면 플라즈몬 공명 바이오센싱 기술을 가져왔습니다. 2세대 제품으로 외관 설계를 개선했고 유럽 시장 진출을 위해 CE 인증을 준비 중입니다. 유럽에는 이미 협력 대리점이 있습니다.</li><li>우자오펑 박사</li><li>시제품은 스위스 취리히연방공대</li><li>커징다 바이오테크 공동창업자</li><li>실험실에 보내 여러 생체 측정 실험을 진행 중입니다. 광저우와 선전의 3급 갑등 병원과도 협력합니다. 고교회 BTE 바이오전은 국내외 바이오센서 전문가와 교류·협력하기에 아주 좋은 무대입니다.</li><li>참가해야 할 6가지 이유 &gt;&gt;&gt;</li><li>• 국가급 플랫폼을 바탕으로 고교회 전문 구매와 긴밀히 연계, 세계 전 산업체인 포괄</li><li>전문 관람객·바이어 26,000명 이상, 전 산업체인 원스톱 구매 교류 플랫폼</li><li>글로벌 시야, 산업의 집결</li><li>국내외 브랜드 300곳 이상 참가</li><li>혁신 제품 1만여 종으로 그리는 세계 바이오 산업의 새 지도</li><li>• 풍부한 경험과 든든한 지원, 글로벌 전시 종합 서비스 기업</li><li>전문 전시회 운영 경험 100여 회</li><li>학술 향연과 트렌드 전망</li><li>전웨이 국제전시그룹이 지원합니다</li><li>전문가 130명 이상, 주제 포럼 60회 이상으로 업계 흐름을 읽고 사업 기회 발굴</li><li>대학·연구기관·국가중점실험실 100곳 이상이 함께 전시해 참가사의 매칭 효율과 산학연 협력을 높입니다</li><li>미디어 매트릭스로 폭넓은 노출</li><li>국내외 언론 1,000여 곳이 전방위 보도</li><li>참가 효과를 높입니다</li><li>주요 참가 기관: 칭화대, 베이징대, 푸단대, 중국과학원, 선전만 실험실 등</li><li>◎ 분자진단·동반진단 서밋 ◎ 혁신 바이오의약·세포치료 포럼 ◎ 항체의약·신약개발 혁신 포럼</li><li>평가 체계와 표준화</li><li>◎ 유전자 시퀀싱 응용 포럼 ◎ AI 기반 의약 혁신 포럼 ◎ 합성생물학 솔루션 서밋</li><li>◎ 미생물 발효 공정 세미나</li><li>제27회 중국 국제 하이테크 성과 교역회</li><li>◎ 줄기세포·재생의학 포럼 ◎ 신형 백신·바이오제품 포럼 ◎ CGT 파괴적 기술 포럼 ◎ 오가노이드·모델동물 응용 포럼 ◎ AI 기반 분광·영상 분석 포럼 · 크로마토그래피 포럼 · 미래 과학 실험실 포럼</li><li>글로벌 구매 매칭 대회</li><li>국제 투자·융자 매칭 대회</li><li>환경 분석 포럼 · 중국 병원 고품질 발전 대회 · 글로벌 바이오의약 서밋 · 글로벌 구매 매칭 대회 ◎ 글로벌 투자·융자 수급 매칭회 ◎ 고교회 시상 평가</li><li>※ 구체적 일정은 현장 발표 기준</li><li>프리미엄 부스 | 3×4m, 12㎡/부스</li><li>국내 기업: 19,800위안/부스 해외 기업: 40,000위안/부스 구성: 주최 측 일괄 시공, 3면 패널, 회사명 간판, 상담 테이블 1개, 접이식 의자 2개, 스포트라이트 2개, 220V/500W 전원</li><li>콘센트 1개, 카펫, 휴지통 1개</li><li>프리미엄 부스 | 3×6m, 18㎡/부스</li><li>국내 기업: 31,600위안/부스 해외 기업: 60,000위안/부스 구성: 주최 측 일괄 시공, 3면 패널, 회사명 간판, 상담 테이블 2개, 접이식 의자 4개, 스포트라이트 4개, 220V/500W 콘센트 2개, 카펫, 휴지통 2개</li><li>빈 공간 부스 | 36㎡부터</li><li>국내 기업: 1,580위안/㎡ 해외 기업: 3,200위안/㎡ 구성: 주요 구역에 배치되며 시설은 포함되지 않습니다. 기업이 직접 또는 추천 시공사에 맡겨 설계·시공하고 전시장 시공관리비와 전기료를 부담합니다.</li></ul></details></figure></main><footer><div class="w"><a href="https://www.chtf.com/">공식 사이트</a> · <a href="https://github.com/PKNU-leejihoon/chtf2026-ko-guide/issues">정보 정정</a></div></footer></body></html>
