<figure><a href="https://www.chtf.com/uploads/allimg/202609/9-26092114130W33.jpg" referrerpolicy="no-referrer" aria-label="원본 이미지 크게 보기"><img src="https://www.chtf.com/uploads/allimg/202609/9-26092114130W33.jpg" alt="" loading="lazy" referrerpolicy="no-referrer"></a><figcaption>원본 이미지</figcaption><details class="img-text"><summary>사진 속 한글 번역</summary><ul><li>제28회 중국 국제 하이테크 성과 교역회</li><li>아시아 AI 컴퓨팅·데이터센터전</li><li>11.26~28 선전 국제회의전시센터(바오안)</li><li>주최: 선전시 인민정부 공동 주최: 중국정보통신연구원 협력: 후이롄(상하이) 비즈니스 컨설팅, 저장 액체냉각망 정보미디어 주관: 전웨이 국제전시그룹, 선전 전웨이 국제전람</li><li>종목코드: 834316</li><li>전시회 소개</li><li>제27회 고교회 주요 수치</li><li>전시 면적</li><li>고교회는 1999년부터 27회 열렸으며 중국 첨단기술 분야의 대외 개방 창구이자 성과 교류·거래 플랫폼으로, 캔톤페어·수입박람회와 함께 중국 3대 국가급 전시회이자 &#x27;중국 과학기술 제1전시회&#x27;로 불립니다.</li><li>브랜드 참가사</li><li>전문 관람객</li><li>AI와 빅데이터의 급성장으로 연산 수요가 기하급수로 늘며 고밀도·고연산 데이터센터가 필연적 흐름이 됐습니다. 이에 친환경·고효율 데이터센터 인프라와 신형 액체냉각 기술이 연산 도약과 에너지 절감의 핵심이 됐습니다.</li><li>국가·지역</li><li>전문 행사</li><li>국가 &#x27;동수서산&#x27; 사업과 탄소중립 전략에 맞춰 연산 인프라,</li><li>데이터센터, 액체냉각, 신형 전력 시스템, 디지털 에너지에 집중하는 아시아 AI 컴퓨팅·데이터센터전을 열어 &#x27;연산+전력+데이터+에너지&#x27; 전 생태계 전문 구역에서 첨단 기술, 혁신 제품, 통합 솔루션을 선보입니다.</li><li>전시회 강점</li><li>15차 5개년 계획 건의는 &#x27;전국 일체화 연산망&#x27;을 처음으로 국가 인프라 체계에 넣고 적절한 선제 건설을 요구했습니다. 선전</li><li>2026년 중국 연산 시장은 1조 856억 위안으로 전년보다 30% 성장할 전망이며 총 연산과 AI 연산 규모 모두 세계 2위입니다. AI가 고밀도 연산 수요를 키우는 가운데 인터넷·기술 업계가 핵심 동력입니다. 선전에는 텐센트, 화웨이 등이 모여 대모델 학습, 숏폼 처리 등으로 연산을 대규모로 구매합니다.</li><li>정책 지원</li><li>15차 5개년 계획은 연산 기반 강화 행동으로 세계</li><li>시장 동력</li><li>선도적인 범용·AI·슈퍼 연산 일체 인프라 구축을 제시합니다. 공업정보화부도 《연산 상호연결 행동계획》, 《도시권 &#x27;밀리초 연산&#x27; 특별행동 통지》 등을</li><li>잇달아 내놓아 연산 산업 발전에 속도를 붙였습니다.</li><li>&#x27;선전-홍콩-광저우&#x27; 혁신 클러스터는 세계 1위에 올랐고 384 슈퍼노드 클러스터는 상용화됐으며 펑청실험실의 &#x27;펑청 클라우드</li><li>선전은 경제특구이자 중국 특색 사회주의 선행 시범구, 웨강아오 대만구의 중심 도시입니다. 이곳에서 열리는 전시회는 인터넷·기술 선도기업의 참여를 끌어내 산업 핵심과 직접 만날 기회를 주고 둥관, 포산, 광저우 등 대만구 산업 지대로 효과가 퍼집니다.</li><li>지역 혁신 역량은 9년 연속 전국 1위입니다. 연산 분야에서는 Ascend</li><li>지역 파급력</li><li>브레인&#x27;이 중국 최대 오픈소스 연산망 시험장을 만들었습니다. 선전은 연산 인프라, 핵심 대모델 개발, 산업 플랫폼 생태계까지 전 과정을 갖췄습니다.</li><li>전시 품목</li><li>Ascend 384 슈퍼노드</li><li>연산 인프라·핵심 하드웨어:</li><li>서버, 스토리지, 네트워크 장비, AI 칩(CPU/GPU/FPGA/ASIC/NPU), 스위치, 라우터, 광모듈, 광섬유·케이블, 액체냉각, 랙 전원</li><li>데이터센터 건설·부대 체계: 마이크로 모듈·컨테이너형 데이터센터, 수배전 시스템, UPS, 정밀 공조, 통합 배선, 소방·보안, 전산실 스마트 관리</li><li>AI·슈퍼·엣지 연산 센터:</li><li>범용·AI·슈퍼컴퓨팅 센터, 엣지 연산 센터, 연산 클러스터, 연산망 노드 통합 솔루션</li><li>연산 서비스:</li><li>통신사, EPC·설계원, 클라우드 사업자, 제3자 IDC, 연산 임대, 연산 스케줄링, 연산 운영, 연산 보안, 서비스 통합</li><li>액체냉각 핵심 기술·장비·원료:</li><li>콜드플레이트(전 액체냉각 서버 포함), 침지식(단상·2상), 분사식 액체냉각, 냉각 모듈 분리 설계, 스마트 온도제어, 유체 분배 기술, 냉각액(불화액, 광유 등), 콜드플레이트, 펌프, 밸브, 퀵커넥터, 열교환기, 누액 감지 장비, 스마트 센서, 상변화 물질(PCM), 냉매, 실리콘유, 이산화탄소·수소, 수용액</li><li>발전기:</li><li>디젤·가스·가솔린·바이오가스 발전기, 열병합 발전기, 가스터빈 발전기, 선박용·방폭 발전기, 이동식 비상 전원차, 이동식 조명탑, 트레일러형 발전기, 수소 발전, 저온 폐열 발전, 비상 디젤 펌프, 냉장 컨테이너용 발전기, 중유 발전소</li><li>액체냉각 장치: 콜드플레이트 제품, 금속 콜드플레이트, 발열 장치·부품, 액체 순환 설비, 침지식 제품, 방열 소자, 방열기, 히트파이프 팬, 냉각액, 펌프, 압축기, 구동 부품, 온도제어 부품, 서모스탯, 온도 센서, 증발기, 응축기, 팽창 탱크</li><li>배관·연결 부품: 고무호스, 금속관, 주름관, 보온관, 수도관·조인트, 냉각 배관과 연결 부품</li><li>보조 방열 장비: 방열팬, 방열 소재, 방열 강화 페이스트, 환기 장비</li><li>지난 참가사</li><li>국가 슈퍼컴퓨팅 선전센터</li><li>동시 행사 CONCURRENT EVENTS</li><li>전문 관람객 구성</li><li>2026 신뢰 Token 클라우드 서비스 포럼 · 2026 글로벌 데이터센터 녹색 발전 대회 · 2026 중국 국제 AIDC 연산 액체냉각 대회 · AI 연산·디지털 에너지 포럼 · 액체냉각 산업 첨단기술 세미나 · 슈퍼컴퓨팅의 빛·데이터 체인의 미래 시상 · &#x27;동수서산&#x27; 산업 매칭회 · 연산+에너지 투자·융자 비공개 매칭회 · 글로벌 구매 매칭 대회</li><li>데이터센터 8.20%</li><li>AI 칩 26.78%</li><li>연구기관·대학 8.40%</li><li>소프트웨어·알고리즘 개발 20.76%</li><li>에너지 10.66%</li><li>컨설팅·금융 서비스 17.21%</li><li>통신·네트워크 15.98%</li><li>2025년 전시 현장 자료 기준</li><li>언론 홍보</li><li>15,000여 건</li><li>70억 회</li><li>국내외 언론 3,000곳 이상</li><li>온라인 전체 노출</li><li>국내외 언론 연중 보도</li><li>기업 부스 서비스 안내</li><li>프리미엄 부스</li><li>공식 위챗</li><li>영상 채널</li><li>연산 공식 계정</li><li>기업의 시장 전략에 맞춰 다양한 방안을 제공합니다. 더 필요한 사항은 전화로 문의하세요.</li><li>전웨이 국제전시그룹 · 선전 전웨이 국제전람 주소: 선전시 바오안구 푸하이 거리 신허 커뮤니티 바오안대로 6099호 싱강퉁촹후이 톈수동 705-706 전화: 0755-85242014, 190 6516 4696</li><li>공식 홈페이지: https://asia-cpdc.com/</li></ul></details></figure></main><footer><div class="w"><a href="https://www.chtf.com/">공식 사이트</a> · <a href="https://github.com/PKNU-leejihoon/chtf2026-ko-guide/issues">정보 정정</a></div></footer></body></html>
