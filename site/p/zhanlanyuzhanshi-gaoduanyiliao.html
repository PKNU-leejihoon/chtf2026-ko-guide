<!doctype html><html lang="ko" class="location-locked"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>아시아 고급 의료기기전 · The 28th China Hi-Tech Fair</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../location.css"><script src="../venue.js" defer></script><script src="../location.js" defer></script></head><body><noscript>안내를 열려면 자바스크립트와 위치 서비스를 켜 주세요.</noscript><header><div class="w"><a class="h" href="../index.html"><b>The 28th China Hi-Tech Fair</b></a><a href="index.html">공식 안내 한글판</a><a href="schedule.html">행사 일정</a><a href="../index.html#find">기업 찾기</a></div></header><main class="w"><h1>아시아 고급 의료기기전</h1><div class="meta"><a href="index.html#expo">전시·전문전</a><a href="https://www.chtf.com/zhanlanyuzhanshi/gaoduanyiliao/" target="_blank" rel="noopener">공식 원문 ↗</a></div><figure><a href="https://www.chtf.com/uploads/allimg/202409/3-24091311060W19.jpg" referrerpolicy="no-referrer" aria-label="원본 이미지 크게 보기"><img src="https://www.chtf.com/uploads/allimg/202409/3-24091311060W19.jpg" alt="" loading="lazy" referrerpolicy="no-referrer"></a><figcaption>원본 이미지</figcaption><details class="img-text" open><summary>사진 속 한글 번역</summary><ul><li>제28회 중국 국제 하이테크 성과 교역회</li><li>THE 28th CHINA HI-TECH FAIR 2026년 11월 26~28일 선전 국제회의전시센터(바오안)</li><li>수급 매칭 · 성과 발표 · 국제 협력 · 산학융합 · 투자·융자 · 첨단 트렌드 · 시장 개척 · 인재 교류</li><li>전문 관람객 45만 명 이상</li><li>전시 면적 40만㎡</li><li>전문 행사 200회 이상</li><li>120개 이상 국가·지역</li></ul></details></figure>
<figure><a href="https://www.chtf.com/uploads/allimg/202603/3-26031214305C57.jpg" referrerpolicy="no-referrer" aria-label="원본 이미지 크게 보기"><img src="https://www.chtf.com/uploads/allimg/202603/3-26031214305C57.jpg" alt="" loading="lazy" referrerpolicy="no-referrer"></a><figcaption>원본 이미지</figcaption><details class="img-text"><summary>사진 속 한글 번역</summary><ul><li>제28회 중국 국제 하이테크 성과 교역회 THE 28th CHINA HI-TECH FAIR</li><li>아시아 고급 의료기기전</li><li>• 선전 국제회의전시센터(바오안)</li><li>주최: 선전시 인민정부</li><li>주관: 전웨이 국제전시그룹, 선전 전웨이 국제전람</li><li>제28회 고교회는 국무원 승인으로 선전시 인민정부가 주최하며 2026년 11월 26~28일 선전 국제회의전시센터에서 열립니다. 전시면적 약 40만㎡에 120여 개 국가·지역의 유명 기업과 국제기구 5,000여 곳이 참가할 예정입니다.</li><li>고교회는 1999년부터 27회 열렸습니다. 1999년 첫 행사는 당시 주룽지 총리가 개막을 선언했고, 그는 내빈을 만나 중국 정부가 매년 고교회를 여는 것은 더 많은 과학기술 성과를 경쟁력 있는 상품으로 빠르게 전환하고 국제 교류·협력을 강화하기 위해서라고 말했습니다.</li><li>고교회는 국가 과학기술 혁신 체계의 중요한 부분이자 첨단기술 분야의 대외 개방 창구, 성과 교류·거래 플랫폼으로 캔톤페어·수입박람회와 함께 중국 3대 국가급 전시회이며 &#x27;중국 과학기술 제1전시회&#x27;로 불립니다.</li><li>고교회 아시아 고급 의료기기전은 &#x27;디지털 미래를 함께 만든다&#x27;를 주제로 병원 현장의 디지털 고급 의료 장비와 기기에 집중합니다. 계산 영상, 디지털 초음파, 원격 의료, VR 수술, 스마트 병원, 빅데이터 의료, 스마트 한의학 분야의 신제품과 기술을 선보여 산업 생태 융합과 의료 건강 업계의 디지털 전환을 돕습니다.</li><li>전문 행사 200회 이상</li><li>전시 면적</li><li>브랜드 참가사</li><li>전문 관람객</li><li>국가·지역</li><li>의료 영상, 의학 검사, 체외진단, 병원 건설, 스마트 의료, 웨어러블, 의료 로봇, 수술실, 의료 전자기기, 의료 광학, 의료 소모품, 소독·감염관리, 정형외과, 의료 지원 관리, 건강관리·서비스, 의료기관, 재활, 스마트 요양 등 중점 분야의 핵심·첨단·주목 제품을 집중 전시합니다.</li><li>참가사·관람객 &gt;&gt;&gt;</li><li>국내외 유명 의료기기 제조사가 참가하고 수출입 무역사, 병원, 유통사, 대리점, 채널사, 요양기관, 재활 간호센터, 고급 의료 서비스 기관, 약국, 의약 체인, 질병통제센터, 혈액원, 연구기관, 대학, 의료 산업단지, 의료·건강 투자자 등 전문 관람객이 방문합니다.</li><li>식사는 3층으로</li><li>풀스택 AI 기술</li><li>① 안내소 Information</li><li>프리미엄 부스 | 3×4m, 12㎡/부스</li><li>프리미엄 부스 | 3×6m, 18㎡/부스</li><li>빈 공간 부스(36㎡부터)</li><li>국내 기업</li><li>국내 기업 19,800위안/부스 해외 기업 40,000위안/부스</li><li>해외 기업 60,000위안/부스</li><li>해외 기업</li><li>중국 하이테크 포럼</li><li>세계적 시야로 국가 전략을 실천하고 과학기술 발전, 거시경제, 자본시장 등 주요 이슈에 집중합니다.</li><li>과학기술 탐구와 의견 공유, 지혜의 교류를 통해</li><li>각계의 힘과 혁신 자원을 모으고 세계 과학기술·경제·금융의 최신 동향과 첨단 사조를 보여 주며 국제 교류·협력을 촉진합니다.</li><li>2 기술 교류회</li><li>국내외 원사, 전문가, 업계 단체 대표, 선도기업 리더가 첨단 성과를 소개하고 기업 발전의 난제를 다층적으로 논의해 과학기술 기업의 혁신을 돕습니다.</li><li>글로벌 바이어 매칭 대회</li><li>제27회 중국 국제 하이테크 성과 교역회 CHINA HI-TECH FAIR</li><li>&#x27;천만 바이어&#x27; 계획으로 참가사와 전문</li><li>글로벌 구매 매칭</li><li>바이어의 1:1 교류 플랫폼을 마련해 수급 양측을 연결하고, 참가사의 수주와 국내외 바이어의 공급망 최적화, 신기술·우수 제품 발굴을 돕습니다.</li><li>신제품 첫 공개</li><li>고교회는 과학기술 기업의 제품 발표 제1플랫폼으로 매년 대표 신제품·신기술·신서비스 1,000건 이상이</li><li>브랜드·제품 소개</li><li>공개됩니다. 세계 첫 공개 무대에서 중국 최초, 세계 최초의 기술과 제품을 선보여 글로벌 바이어와의 협력을 이끕니다.</li><li>과학기술 성과 전환·거래 행사</li><li>앞선 첨단기술과 성과를 모아 시 과학기술혁신국의 칭텅 성과 전환 서비스 체계와 연계하고 로드쇼 발표와 상담으로 성과 전환을 촉진합니다.</li><li>고교회 시상 행사</li><li>• 시상 평가 행사</li><li>과학기술 기업의 자주 혁신과 인재·연구팀의 잠재력을 북돋우고 참가 기관의 혁신 역량 전시를 장려하며 우수 사례를 표창합니다.</li><li>공식 위챗</li><li>공식 홈페이지</li></ul></details></figure></main><footer><div class="w"><a href="https://www.chtf.com/">공식 사이트</a> · <a href="https://github.com/PKNU-leejihoon/chtf2026-ko-guide/issues">정보 정정</a></div></footer></body></html>
