<!doctype html><html lang="ko" class="location-locked"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>대모델·AI 에이전트의 안전·윤리·거버넌스 · The 28th China Hi-Tech Fair</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../location.css"><script src="../venue.js" defer></script><script src="../location.js" defer></script></head><body><noscript>안내를 열려면 자바스크립트와 위치 서비스를 켜 주세요.</noscript><header><div class="w"><a class="h" href="../index.html"><b>The 28th China Hi-Tech Fair</b></a><a href="index.html">공식 안내 한글판</a><a href="schedule.html">행사 일정</a><a href="../index.html#find">기업 찾기</a></div></header><main class="w"><h1>대모델·AI 에이전트의 안전·윤리·거버넌스</h1><div class="meta"><a href="index.html#forum">포럼·행사</a><a href="https://www.chtf.com/luntanjihuodong/zhcsluntan/" target="_blank" rel="noopener">공식 원문 ↗</a></div><figure><a href="https://www.chtf.com/uploads/allimg/202611/9-261116111013301.png" referrerpolicy="no-referrer" aria-label="원본 이미지 크게 보기"><img src="https://www.chtf.com/uploads/allimg/202611/9-261116111013301.png" alt="" loading="lazy" referrerpolicy="no-referrer"></a><figcaption>원본 이미지</figcaption><details class="img-text"><summary>사진 속 한글 번역</summary><ul><li>2026 AI 선구자 포럼: 신뢰할 수 있는 AI, 대모델과 에이전트의 안전·윤리·거버넌스</li><li>포럼 기획안</li><li>일시: 2026년 11월 26일 14:00~17:30</li><li>장소: 선전 국제회의전시센터 14호 회의실 A홀</li><li>1. 포럼 소개</li><li>대모델로 대표되는 생성형 AI는 복잡한 추론, 도구 호출, 자율 실행이 가능한 에이전트로 빠르게 진화하며</li><li>&#x27;AI+&#x27;를 스마트 제조, 금융, 의료, 공공 거버넌스로 넓히고 있습니다. 한편 모델의</li><li>환각과 편향, 데이터·개인정보 유출, 생성물 왜곡, 프롬프트 주입, 에이전트 권한 남용, 책임 경계의 불명확성은</li><li>기업이 대규모로 도입할 때의 핵심 과제입니다. 중국은 《생성형 AI 서비스 관리 임시 방법》, 《AI 생성·합성</li><li>콘텐츠 표시 방법》, 《AI 과학기술 윤리 심사·서비스 방법(시행)》을 잇달아 내놓았고, 국무원 《&#x27;AI+&#x27; 행동 심화 실시 의견》도 발전과 안전의 병행을 강조해 신뢰할 수 있는 AI에 더 높은 요구를 제시했습니다.</li><li>이 포럼은 &#x27;신뢰할 수 있는 AI: 대모델과 에이전트의 안전·윤리·거버넌스&#x27;를 주제로 홍콩 링난대, 하얼빈공대(선전), 남방과기대, 선전대, 베이징사범-홍콩침례대 전문가와 ZTE,</li><li>선전데이터거래소, 중국정보통신연구원 등 기업·응용 기관 대표를 모아 신뢰 AI 핵심기술, 윤리 심사와 법적</li><li>책임, 모델·에이전트 안전 평가, 기업 전 주기 거버넌스, 대표 사례를 논의합니다. &#x27;첨단 발표-산업 발표-원탁 토론&#x27;을 축으로 평가·실행·추적이 가능한 거버넌스 방법과 산업 사례를 다뤄 연구,</li><li>공학, 산업 수요를 잇고 선전 AI 산업의 안전하고 건강한 고품질 발전을 지원합니다.</li><li>2. 포럼 조직</li><li>주최: 선전시 인공지능학회, 선전시 지역 과학기술윤리 서비스 플랫폼 주관: 선전시 인공지능학회 AI 윤리 거버넌스 전문위원회, 선전시 AI 윤리심사위원회 협력: 링난대(홍콩), 선전 베이징대-홍콩과기대 의학센터, 하얼빈공대(선전),</li><li>베이징사범-홍콩침례대</li><li>3. 포럼 의장</li><li>야오신</li><li>링난대 부총장(연구·혁신), 탕톈자오 기계학습 석좌교수, IEEE Fellow, 홍콩공학한림원 원사, 선전시 인공지능학회 AI 윤리 거버넌스 전문위원회 주임</li><li>뤄원젠</li><li>하얼빈공대(선전) 사이버공간안전연구원/컴퓨터과학기술학원 종신교수, 박사과정 지도교수, 광둥성 주장 인재계획 선도 인재, 광둥성 안전 지능 신기술 중점실험실 부주임</li><li>황창우</li><li>베이징사범-홍콩침례대 보야 지능학원 부교수, 박사과정 지도교수, 선전시 인공지능학회 AI 윤리 거버넌스 전문위원회 사무국장</li><li>4. 포럼 일정(총 180분)</li><li>사회: 뤄원젠</li><li>제안 내용·초청 연사 / 내빈 축사</li><li>순서: 개회사, 첨단 발표(1)</li><li>시간/소요</li><li>리빈 | 선전대: 대모델 기반 위조 판별·포렌식</li><li>웨이쉐타오 | 남방과기대</li><li>첨단 발표(2)</li><li>AI 윤리의 공학화: 지금 해야 할 일 / 구량 | 선전데이터거래소: 데이터 요소 유통과 AI 산업의 상호 촉진 / 주샤오광 | ZTE</li><li>산업 발표(1)</li><li>산업 발표(2)</li><li>AI 윤리 심사 구축과 사례 / 후나잉 | 중국정보통신연구원(초청 예정): 첨단 AI 안전 위험 관찰과 거버넌스 실천</li><li>거버넌스·표준 발표</li><li>주제: &#x27;신뢰할 수 있는 모델&#x27;에서 &#x27;신뢰할 수 있는 응용&#x27;으로: 안전하고 통제 가능한</li><li>원탁 토론</li><li>에이전트를 어떻게 구현할까?</li><li>패널: 차오젠펑, 구량, 후나잉, 리빈, 웨이쉐타오, 주샤오광 / 의장이 합의 사항을 정리하고 산학연 협력, 평가·거버넌스 서비스의 후속 방향을 제시합니다. 기념 촬영.</li><li>포럼 총정리</li><li>5. 연사와 발표 소개(발표 순)</li><li>리빈</li><li>선전대 교수, 박사과정 지도교수, 광둥성 자연과학기금 걸출청년기금</li><li>수혜자, 선전시 고급 전문인재, 선전시 우수교사, IEEE/CCF/CSIG 시니어 회원이며 세계 상위 2% 과학자 &#x27;평생 영향력&#x27; 명단에 올랐습니다. 광둥성 지능정보처리 중점실험실 주임, 선전시 미디어 정보콘텐츠 보안 중점실험실 주임, 광둥성 영상그래픽학회 이사장, IEEE T-IFS 부편집장입니다. AI 안전을 연구하며 딥페이크 탐지, 멀티미디어</li><li>위조 판별, AI 거버넌스를 다룹니다. IEEE T-IFS, T-IP, T-CSVT 등에 SCI·EI 논문 150여 편을 냈고 교재 2권을 집필했으며 구글 학술 인용은 1.1만 회를 넘습니다. 국가자연과학기금 공동기금 중점과제 등을 맡았고 중국 발명특허 10여 건, 미국 특허 2건, 특허 이전 2건, 관련 기술표준 2건에 참여했습니다. 중국컴퓨터학회 자연과학 1등상, 선전시 자연과학 2등상, 중국영상그래픽학회 자연과학 2등상을 받았습니다.</li><li>발표 제목: 발표 요약:</li><li>대모델 기반 위조 판별·포렌식</li><li>생성형 AI가 &#x27;진짜 같은 가짜&#x27;의 문턱을 크게 낮추며 위조 콘텐츠가 공공</li><li>안전 위험이 됐고, 위조 판별·포렌식은 AI 거버넌스의 핵심이 됐습니다. 수동적 위조 판별은</li><li>최후의 안전망으로 유효하지만 기존 모델은 일반화, 강건성, 설명 가능성에 한계가 있습니다. 평가에 따르면 범용 멀티모달 대모델은 어느 정도 판별 능력이 있어도 저수준 흔적 식별, 상황 간 판단 안정성, 환각에서 문제가 남습니다. 이 발표는 연구팀의</li><li>판별 작업용 대모델 맞춤 최적화를 소개합니다. 표현 재사용,</li><li>지식 주입, 내재적 맞춤화, 전문가 모델 협업으로 AI 생성 이미지, 얼굴 딥페이크, 신분증 위조, 변조 위치 탐지를 지원하고, 신뢰도 보정 공동 최적화로 &#x27;모르는 것을 아는&#x27; 능력을 구현해 일반화, 강건성, 설명 가능성을 갖춘 판별 체계를 만듭니다.</li><li>웨이쉐타오</li><li>남방과기대 컴퓨터과학공학과 종신 부교수(연구원), 박사과정</li><li>지도교수. 국가 중점 연구개발계획, 국가자연과학기금, 광둥성 과학기술청 과제 등 10여 건을 맡았고 CCF-A급 학회와 IEEE Transactions 등에 논문 120여 편을 냈습니다. AI 윤리·안전(Safety), 대모델, 에이전트를 연구합니다.</li><li>발표 제목:</li><li>AI 윤리의 공학화: 지금 해야 할 일</li><li>발표 요약:</li><li>AI 거버넌스의 시급성은 원칙 제시에서 실행 능력으로 옮겨 갔습니다. 먼저 자주 혼용되는 ethics, safety, security 세 개념을 구분합니다. 이를 혼동하면 거버넌스 목표와 도구 선택이 어긋나며, 관계를 명확히 하는 것이 실행 가능한 틀의 전제입니다. 다음으로 AI 윤리가 문헌상의 사변과 원칙 논쟁에 머물면</li><li>거버넌스의 시간표에 대응하기 어렵기에 &#x27;실천적 유보&#x27;를 제안합니다. 논쟁은 이어 가되 거버넌스는 기다릴 수 없다는 뜻입니다. 공학화는 윤리 논의를 끝내는 것이 아니라 실행·검증·감사가 가능한 시스템 제약과 도구로 옮기는 일입니다. 끝으로 AI 거버넌스는 한 번의 최적 설계가 아닌 동적 조정 과정으로, 실천 속에서 반복·수정해야 함을 밝히고 개념 구분에서 공학 구현, 동적 반복으로 이어지는 경로를 제시합니다.</li><li>구량</li><li>박사, 교수급 고급 엔지니어. 선전데이터거래소 총경리, 전국 데이터표준화기술위원회 위원, 중국인공지능학회 지능융합 전문위원, 중국컴퓨터학회 시스템소프트웨어 전문위원, 광둥성 디지털정부 개혁건설 전문가위원, 광둥성 AI·로봇 산업연맹 데이터 생태 전문위 부주임입니다. 예일대 박사후연구원·부연구원, Sangfor 수석과학자·연구개발 부총재, XtalPi 최고기술책임자·지능 자동화 사업부 책임자를 지냈습니다. 2025 스마트 차이나 연례회의 &#x27;디지털 정부 10대 혁신 인물&#x27;에 뽑혔고 2022년 수리부 다위상 1등상, 2022년 선전시 과학기술진보상 2등상을 받았습니다.</li><li>데이터 요소 유통과 AI 산업의 상호 촉진</li><li>이 발표는 국가 데이터 재산권 등기를 바탕으로 국가 데이터 인프라가 제공하는</li><li>신뢰 데이터 공간과 프라이버시 컴퓨팅, 블록체인 기술을 활용해 데이터의 합법적</li><li>유통·거래와 자산화·자본화를 지원하고 개인을 포함한 참여자의 수익권을 보장해 AI와 체화지능 발전을 촉진하는 방안을 다룹니다. 또한 AI 기반 데이터 거버넌스와 응용이 고품질 데이터 개발·공급을 앞당겨 양측이 서로를 강화하는 구조를 설명합니다.</li><li>주샤오광</li><li>박사, 교수급 고급 엔지니어(정고급). ZTE에서 통신, 전자, 정보 기술의 선행 연구와 제품 개발을 맡아 발명특허 40여 건, 논문 7편, 저서 1권, 선전 과학기술진보상 1건의 성과를 냈습니다.</li><li>AI 윤리 심사 구축과 사례</li><li>먼저 정책 요구, 기업 수요, 윤리 위험 등 기업 과학기술 윤리 심사의 배경을 소개합니다. 이어 조직, 제도, 절차, 범위, 심사 체계 등 기반 구축을 설명하고, 끝으로 AI 3요소, 응용 심사 요점, 심사 사례를 공유해 기업의 AI 윤리 심사 구축에 실용적인 참고를 제공합니다.</li><li>후나잉</li><li>중국정보통신연구원 인공지능연구소 안전거버넌스부 부주임, ITU-T SG17 Q16 AI 안전 그룹 부보고관, AI산업발전연맹(AIIA) AI 안전거버넌스위원회 거버넌스 조장입니다. AI 안전 거버넌스, 위험 관리, 개인정보 보호를 연구하며 국제 협력 경험이 풍부합니다. 중국 AI 산업</li><li>발전연맹의 《AI 안전 약속》을 기획했고 중국정보통신연구원</li><li>《AI 안전 거버넌스 연구보고서(2025)》, 세계인터넷대회 《책임 있는 생성형 AI 발전 연구보고서·합의문》 집필을 이끌었으며,</li><li>《AI 거버넌스 청서(2024)》, 《AI 발전 보고서(2024)》, 《싱가포르 합의 2026》 집필에 참여했습니다. Science, ICML 등에 AI 안전 거버넌스 논문 2편을 함께 발표했고 국제·국가·업계 표준 5건에 참여했습니다. 중국과 미국 뉴욕주 변호사 자격을 갖췄습니다.</li><li>첨단 AI 안전 위험 관찰과 거버넌스 실천</li><li>대모델과 AI 에이전트가 빠르게 발전하며 새로운 안전 위험이 잇달아 나타납니다. 2026년 사건 관찰과 실측 자료로 적대적 공격, 사실 환각, 모델 영합, 에이전트 권한 남용을 분석하고, AI 제도 거버넌스, 업계 자율, 윤리 심사, 평가·표준화 실천을 소개하며 거버넌스 요구를 평가 가능한 기술·관리 수단으로 구현하는 방법을 모색합니다.</li><li>차오젠펑</li><li>선전대 법학원 부교수. 중국과학기술협회 유엔 자문 &#x27;과학기술 윤리·책임 있는 혁신 전문위&#x27;, 중국인공지능학회 AI 윤리·거버넌스 공작위, 중국통신학회 네트워크·데이터 안전 전문위, 중국과학학·과학기술정책연구회 첨단기술·산업혁신 거버넌스 전문위 위원, 중국윤리학회 과학기술윤리 전문위 이사, 광둥성 법학회 정보통신법학연구회 이사, 선전시 인공지능학회 AI 윤리 거버넌스 전문위 부주임, 선전시 과학기술윤리 전문가자문위 위원, 세계경제포럼 AI Governance Alliance 전문가입니다. 《법률과학》, 《화둥정법대 학보》, 《광명일보》 등에 논문 수십 편을 발표했고 일부는 《중국사회과학문적》 등에 전재됐으며 번역서 2권을 냈습니다.</li><li>2024·2025년 연속 중국 CNKI 고피인용 학자 상위 1%(법학)에 선정.</li><li>박사, 연구원, 석사과정 지도교수. 선전시 지역 과학기술윤리 서비스 플랫폼 연구원이자 홍보·교육부 책임자로 과학기술 윤리와 연구 윤리 분야에서 오래 일했습니다. 제1저자 또는 교신저자로 SCI 논문 30여 편을 냈고 인용은 500여</li><li>회입니다. 《중국의학윤리학》, 《의학과 철학》, 《베이징대 학보(의학판)》 등에 과학기술 윤리 논문을 다수 발표했습니다. 2025년 선전시 과학기술윤리 전략연구 과제 《기업 과학기술 윤리 거버넌스 현황과 대책》을 수행했습니다. 사회 활동: 광둥성 윤리학회 이사, 선전시 약학회 약물·의료기기 임상시험 전문위 상무위원, 중화의학회 윤리분회 임상윤리학조 위원, 중국자연변증법연구회 과학기술·공학윤리 전문</li><li>위원회 위원, 중국과학학·과학기술정책연구회 연구윤리·책임 있는 혁신 전문위 위원, UBTECH 과학기술윤리위원회 고문.</li></ul></details></figure></main><footer><div class="w"><a href="https://www.chtf.com/">공식 사이트</a> · <a href="https://github.com/PKNU-leejihoon/chtf2026-ko-guide/issues">정보 정정</a></div></footer></body></html>
