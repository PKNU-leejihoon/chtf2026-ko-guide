<!doctype html><html lang="ko" class="location-locked"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>아시아 반도체·IC 산업전 · The 28th China Hi-Tech Fair</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../location.css"><script src="../venue.js" defer></script><script src="../location.js" defer></script></head><body><noscript>안내를 열려면 자바스크립트와 위치 서비스를 켜 주세요.</noscript><header><div class="w"><a class="h" href="../index.html"><b>The 28th China Hi-Tech Fair</b></a><a href="index.html">공식 안내 한글판</a><a href="schedule.html">행사 일정</a><a href="../index.html#find">기업 찾기</a></div></header><main class="w"><h1>아시아 반도체·IC 산업전</h1><div class="meta"><a href="index.html#expo">전시·전문전</a><a href="https://www.chtf.com/zhanlanyuzhanshi/bandaoti/" target="_blank" rel="noopener">공식 원문 ↗</a></div><figure><a href="https://www.chtf.com/uploads/allimg/202409/3-24091311060W19.jpg" referrerpolicy="no-referrer" aria-label="원본 이미지 크게 보기"><img src="https://www.chtf.com/uploads/allimg/202409/3-24091311060W19.jpg" alt="" loading="lazy" referrerpolicy="no-referrer"></a><figcaption>원본 이미지</figcaption><details class="img-text" open><summary>사진 속 한글 번역</summary><ul><li>제28회 중국 국제 하이테크 성과 교역회</li><li>THE 28th CHINA HI-TECH FAIR 2026년 11월 26~28일 선전 국제회의전시센터(바오안)</li><li>수급 매칭 · 성과 발표 · 국제 협력 · 산학융합 · 투자·융자 · 첨단 트렌드 · 시장 개척 · 인재 교류</li><li>전문 관람객 45만 명 이상</li><li>전시 면적 40만㎡</li><li>전문 행사 200회 이상</li><li>120개 이상 국가·지역</li></ul></details></figure>
<figure><a href="https://www.chtf.com/uploads/allimg/202603/3-260312143H34a.jpg" referrerpolicy="no-referrer" aria-label="원본 이미지 크게 보기"><img src="https://www.chtf.com/uploads/allimg/202603/3-260312143H34a.jpg" alt="" loading="lazy" referrerpolicy="no-referrer"></a><figcaption>원본 이미지</figcaption><details class="img-text"><summary>사진 속 한글 번역</summary><ul><li>제28회 중국 국제 하이테크 성과 교역회</li><li>아시아 반도체·집적회로 산업전</li><li>2026년 11월 26~28일</li><li>선전 국제회의전시센터(바오안)</li><li>고교회: 중국 과학기술 제1전시회</li><li>고교회는 1999년부터 27회 열렸으며 중국 첨단기술 분야의 대외 개방 창구이자 성과 교류·거래 플랫폼으로, 캔톤페어·수입박람회와 함께 중국 3대 국가급 전시회이자 &#x27;중국 과학기술 제1전시회&#x27;로 불립니다.</li><li>제27회 고교회 아시아 반도체·집적회로 산업전은 선전시 인민정부가 주최하고 선전 전웨이 국제전람과 선전시 반도체산업협회가 공동 주최했습니다. 우수 기업 350여 곳이 모이고 포럼 10여 회가 열렸으며 Empyrean, 완리옌, 시화 테크, Longsys, Unilumin, 카이양 전자, 지커 등이 참가해 전시, 첫 공개, 기술 발표, 학술 교류, 무역 매칭을 결합했습니다. 2026년 전시회는 고교회 핵심 주제전으로 반도체 소재, 화합물 반도체, IC 설계, 웨이퍼 제조 장비, 장비 핵심 부품, 첨단 패키징 등 전 산업체인을 다루며 새로운 수요를 찾고 시장 기회를 함께 넓히고 국내외 기술 혁신과 응용 성과를 보여 줍니다.</li><li>◆ 제27회 고교회 주요 수치</li><li>전문 관람객</li><li>브랜드 참가사</li><li>전시 면적</li><li>회 전문 행사</li><li>국가·지역</li><li>고교회 아시아 반도체·집적회로 산업전</li><li>6대 강점</li><li>정책 강점: 선전 15차 5개년 계획은 고교회 등 전시 플랫폼의 견인 역할, 집적회로 산업 강점 확대, 핵심기술 공략을 제시합니다. 선전은 반도체·집적회로를 중점</li><li>클러스터 강점: 선전은 &#x27;상류 지원</li><li>산업-중류 생산-하류 응용&#x27; 체계를 갖췄고</li><li>SiCarrier, Empyrean, 펑신웨이, 궈웨이그룹, 화웨이, BYD 등이 있습니다. 난산 스마트파크, 선전만 과학기술단지 등 집적지와 상하류 산업체인을 갖춰 협력 비용을 낮추고</li><li>육성하는 &#x27;20+8&#x27; 산업 클러스터의 하나로 삼았으며,</li><li>《선전시 반도체·집적회로 산업 고품질 발전 촉진 조치》를 시행하고 있습니다.</li><li>기술 개선과 성과 전환을 앞당깁니다.</li><li>시장 강점: 선전은 중국 최대의 칩 유통지이자 응용 시장으로 소비자 전자, 신에너지차, AI, IoT, 클라우드 등 고성장 분야의 수요가 왕성합니다. 세계와 연결되는 개방 허브로서 국내외 판로와 고객을 넓히는 데 도움이 되고</li><li>금융 강점: 선전시 반도체·집적회로</li><li>산업투자기금 &#x27;사이미 산업 사모펀드&#x27;는 총 50억 위안 규모로 반도체</li><li>중점 프로젝트와 세부 선도기업, 산업체인 보강 프로젝트에 투자합니다. 은행, 벤처투자, 증권사 등이 모여 시드기, 성장기,</li><li>성숙기를 아우르는 금융 서비스 체계를 갖췄습니다.</li><li>시장 점유율을 높입니다.</li><li>기술 강점: 선전은 중국에서 첨단기술 산업 집적도, 시장화, 개방성이 가장 높은 도시 중 하나입니다. 2025년 말 유효 &#x27;소거인&#x27; 기업은 1,333곳으로,</li><li>플랫폼 강점: 고교회라는 국가급 플랫폼 자원을 함께 활용합니다. 제27회</li><li>고교회에는 120여 개 국가·지역의 전문 관람객이 찾아 3일간 연인원 45만 명을 넘었고, 신제품·신성과 5,000여 건 발표, 주요 행사 200여 회, 수급 매칭·투자 협약 1,023건을 기록했으며,</li><li>선전은 중국 &#x27;전문화·특화 제1도시&#x27;가</li><li>됐습니다. 대학, 연구기관,</li><li>기업 연구개발센터가 많아 산학연이 긴밀히</li><li>융합된 혁신 생태계가 기술과 인재를 뒷받침합니다.</li><li>의향 거래·투자 금액은 1,700억 위안을 넘었습니다.</li><li>전시 품목</li><li>반도체 소재: 실리콘 웨이퍼, 실리콘계 소재, 연마 패드, 포토마스크, 스퍼터링 타깃, 연마액, 식각액, 세라믹 패키징 소재, 패키지 기판, 포토레지스트, 특수가스, 초순수</li><li>화합물 반도체: SiC, GaN, 입방정 질화붕소(CBN), SiC 결정 성장로, SiC·GaN 기판과 에피웨이퍼, SiC·GaN 전력소자</li><li>IC 설계</li><li>EDA/IP, 프로세서, 메모리, 디지털·아날로그 칩, 차량용 칩,</li><li>소비자 전자용 칩, 산업용 칩</li><li>웨이퍼 제조 장비: 식각, 이온주입, 박막 증착, 노광기, 코터·디벨로퍼, 박화, 습식 처리, 세정, 연마, 계측·검사 장비</li><li>반도체 장비 핵심 부품</li><li>RF 전원, RF 발생기, 밸브, 진공펌프, 밸브 코어, 정전척, 씰링, 이송</li><li>모듈, 가스 유량계, 정밀 베어링, 모션 컨트롤러, 코팅 소재, 정밀 모션 스테이지,</li><li>로봇팔, 반응 챔버 샤워헤드</li><li>첨단 패키징</li><li>플립칩, 웨이퍼 레벨, 2.5D, 3D, 범프 패키징, 팬아웃 웨이퍼</li><li>레벨 패키징, 프로브 스테이션, 테스터, 핸들러, X선 검사 장비</li><li>동시 행사</li><li>반도체 핵심기술 공략·첨단 혁신 포럼 시리즈 · 시상식</li><li>반도체 프로젝트 소개 발표회 · 반도체 전 산업체인 생태 포럼 · 국제 구매 발표회</li><li>국제 투자·융자 매칭 대회</li><li>지난 참가사</li><li>소재 13.27%</li><li>칩</li><li>첨단 기술</li><li>협력·공급사 탐색 7.14%</li><li>전자부품</li><li>연산·알고리즘</li><li>장비 34.69%</li><li>2025년 전시 현장 자료 기준</li><li>언론 홍보</li><li>15,000여 건</li><li>70억 회</li><li>3,000곳 이상</li><li>온라인 전체 노출</li><li>국내외 언론 연중 보도</li><li>국내외 언론</li><li>기업 부스 서비스 안내</li><li>빈 공간(36㎡부터 판매)</li><li>프리미엄 부스</li><li>영상 채널</li><li>공식 위챗</li><li>위챗 공식 계정</li><li>기업의 시장 전략에 맞춰 다양한 방안을 제공합니다. 더 필요한 사항은 전화로 문의하세요.</li><li>전웨이 국제전시그룹 · 선전 전웨이 국제전람 주소: 선전시 바오안구 푸하이 거리 신허 커뮤니티 바오안대로 6099호 싱강퉁촹후이 톈수동 705-706</li><li>전화: 0755-85242014 공식 홈페이지: https://semiicexpo.com/</li></ul></details></figure></main><footer><div class="w"><a href="https://www.chtf.com/">공식 사이트</a> · <a href="https://github.com/PKNU-leejihoon/chtf2026-ko-guide/issues">정보 정정</a></div></footer></body></html>
