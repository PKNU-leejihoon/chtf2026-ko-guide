<!doctype html><html lang="ko" class="location-locked"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>아시아 신소재 산업전 · The 28th China Hi-Tech Fair</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../location.css"><script src="../venue.js" defer></script><script src="../location.js" defer></script></head><body><noscript>안내를 열려면 자바스크립트와 위치 서비스를 켜 주세요.</noscript><header><div class="w"><a class="h" href="../index.html"><b>The 28th China Hi-Tech Fair</b></a><a href="index.html">공식 안내 한글판</a><a href="schedule.html">행사 일정</a><a href="../index.html#find">기업 찾기</a></div></header><main class="w"><h1>아시아 신소재 산업전</h1><div class="meta"><a href="index.html#expo">전시·전문전</a><a href="https://www.chtf.com/zhanlanyuzhanshi/yazhouxincailiaochanyezhan/" target="_blank" rel="noopener">공식 원문 ↗</a></div><figure><a href="https://www.chtf.com/uploads/allimg/202409/3-24091311060W19.jpg" referrerpolicy="no-referrer" aria-label="원본 이미지 크게 보기"><img src="https://www.chtf.com/uploads/allimg/202409/3-24091311060W19.jpg" alt="" loading="lazy" referrerpolicy="no-referrer"></a><figcaption>원본 이미지</figcaption><details class="img-text" open><summary>사진 속 한글 번역</summary><ul><li>제28회 중국 국제 하이테크 성과 교역회</li><li>THE 28th CHINA HI-TECH FAIR 2026년 11월 26~28일 선전 국제회의전시센터(바오안)</li><li>수급 매칭 · 성과 발표 · 국제 협력 · 산학융합 · 투자·융자 · 첨단 트렌드 · 시장 개척 · 인재 교류</li><li>전문 관람객 45만 명 이상</li><li>전시 면적 40만㎡</li><li>전문 행사 200회 이상</li><li>120개 이상 국가·지역</li></ul></details></figure>
<figure><a href="https://www.chtf.com/uploads/allimg/202607/9-260FQ41605426.jpg" referrerpolicy="no-referrer" aria-label="원본 이미지 크게 보기"><img src="https://www.chtf.com/uploads/allimg/202607/9-260FQ41605426.jpg" alt="" loading="lazy" referrerpolicy="no-referrer"></a><figcaption>원본 이미지</figcaption><details class="img-text"><summary>사진 속 한글 번역</summary><ul><li>제28회 중국 국제 하이테크 성과 교역회</li><li>아시아 신소재 산업전</li><li>2026.11.26~28 선전 국제회의전시센터(바오안)</li><li>주최:</li><li>선전시 인민정부</li><li>주관:</li><li>전웨이 국제전시그룹 &amp; 선전 전웨이 국제전람</li><li>고교회: 국가급 전시회</li><li>1999년 국무원 승인을 거쳐 당시 주룽지 총리가 발표한 대로</li><li>중국 정부는 매년 고교회를 열기로 했습니다.</li><li>고교회는 중국 첨단기술 분야의 대외 개방 창구이자 성과 교류·거래의 다리로, 캔톤페어·수입박람회와 함께 중국 3대 국가급 전시회로 꼽히고 &#x27;세계 과학기술 제1전시회&#x27;로 불리며, 신기술·신소재·신에너지를 알리고 거래하는</li><li>국가 대표 플랫폼입니다. 지난 전시는 40만㎡ 규모로 미국, 영국, 프랑스, 독일, 일본, 한국, 러시아, 인도, 인도네시아, 베트남, 이스라엘, 사우디, UAE 등 120여 개 국가·지역의 구매단 1,036개와 전문 관람객을 모았고 3일간 연인원 45만 명을 넘었습니다. AI·로봇, 반도체, 항공우주, 저고도 경제, ESS·배터리 등 주제전에서 신제품·신성과 5,000여 건을 발표하고 주요 행사 200여 회를 열어 수급 매칭과 투자·융자 프로젝트 1,023건을 성사시켰으며,</li><li>의향 거래·투자 금액은 1,700억 위안을 넘었습니다.</li><li>국가·지역</li><li>전시 면적</li><li>브랜드 참가사</li><li>전문 관람객</li><li>회 전문 행사</li><li>사명: 자원으로 나라에 보답</li><li>희토류 강국</li><li>아시아 신소재 산업전은 제28회 고교회의 핵심 전문 주제전으로 2026년 11월 26~28일 선전 국제회의전시센터(바오안)에서 열립니다. 국가 신소재 산업 전략에 맞춰 중국희토그룹, 중국강연, 장시구리, 중국거스, 언제, 완화화학 등 선도기업이 참가해 광전자 소재, 희토류 기능 소재, 비철금속, 항공우주 소재, 고급 고분자, 반도체 기판, 리튬 배터리 소재, 특수 금속 등 전 산업체인의 첨단 성과와 국산 전략 신소재의 기술 돌파·산업화 수준을 보여 줍니다.</li><li>선전은 아시아 신소재 산업전을 열기에 가장 알맞은 도시입니다</li><li>선전은 중국 신소재 산업의 선도 거점으로 반도체, 신에너지, 항공우주의 첨단 고성능 소재 수요가 모여 있습니다.</li><li>• 기술 강점: 선전은 중국 &#x27;전문화·특화 제1도시&#x27;로 &#x27;소거인&#x27; 기업이 1,333곳입니다.</li><li>정책 강점: 15차 5개년 계획은 신소재를 전략 지주산업으로 명시했고 선전은 신소재를 &#x27;20+8&#x27; 산업 클러스터에 포함했습니다.</li><li>04 스마트 제조 강점</li><li>선전은 중국 제1의 공업도시로 규모 이상 공업 총생산과 부가가치에서 4년 연속</li><li>전국 도시 1위입니다.</li><li>선전은 중국 제1의 무역도시로 수출 규모가 32년 연속 전국 1위이며 신소재의 해외 판로 개척을 돕습니다.</li><li>아시아 신소재 산업전은 고교회의 국가급 플랫폼 자원을 함께 활용합니다.</li><li>전시 품목</li><li>반도체·집적회로 신소재</li><li>실리콘 기판, 칩 공정용 전자화학품, 스퍼터링 타깃·전도성 금속, 3세대 와이드밴드갭 반도체 소재, 첨단 패키징 소재, 반도체 기능 복합소재</li><li>전자정보·광전 신소재</li><li>디스플레이 소재, PCB 기재, 열전도·방열 전자 복합재, 전자파 차폐 고분자, 광통신 소재</li><li>항공우주·고급 장비 신소재</li><li>고급 탄소섬유 복합재, 전용 수지, 항공 특수 세라믹, 금속기 항공 복합재, 항공 경량 합금, 특수 우주 기능 소재, 우주 단열 방호 소재, 철도 경량화 소재, 해양공학 방식 소재</li><li>비철금속·희토류 기능 신소재</li><li>고급 구리계·알루미늄계 소재, 티타늄·마그네슘 등 희유 경금속, 희토류 기능 금속, 희산 금속, 귀금속 소재, 금속기 복합 기능 소재, 고엔트로피 합금, 비정질 합금, 3D 프린팅 금속 분말, 초경합금·분말야금 소재</li><li>신에너지·ESS·수소 전용 소재</li><li>리튬 배터리 핵심 소재 일체, 차세대 배터리 소재, 태양광 소재, 수소 촉매, 막 소재, ESS 열관리·단열 복합재, 신에너지차 경량 합금·복합재, 신에너지 전자 기능 소재</li><li>고급 고분자·첨단 복합소재</li><li>내열 엔지니어링 플라스틱, 불소·실리콘 특수 고분자, 고급 엘라스토머·기능성 필름, 바이오 기반 소재, 생분해 고분자, 고성능 유기섬유·수지기 복합재, 특수 접착제, 기능성 도료, 씰링·제진 소재, 3D 프린팅 고분자</li><li>첨단 무기 비금속 신소재</li><li>구조·기능성 특수 세라믹, 광학 유리, 탄소 기능 소재, 에어로젤 단열 복합재, 기능성 무기 분말, 내화·여과·흡착 무기 소재, 3D 프린팅 세라믹</li><li>바이오·의료 신소재</li><li>의료용 티타늄 합금, 귀금속 임플란트 소재, 흡수성 의료 고분자, 바이오세라믹, 의료 센서·광</li><li>전 소재, 의료용 막·드레싱 기재</li><li>첨단 파괴적 신소재</li><li>2차원 나노소재, 광전·전자기·음향 스마트 메타물질, 자극 반응형 소재, 초전도·양자정보 소재, 액체 금속, 다기능 3D 프린팅 복합재</li><li>지난 참가사</li><li>동시 행사</li><li>신소재 산업 발전 생태 대회 · 3세대 반도체 소재 기술 서밋</li><li>2차원 탄소 나노소재 혁신 포럼</li><li>신소재 경량화 응용 포럼</li><li>언론 홍보</li><li>국내외 언론 연중 보도 15,000여 건</li><li>온라인 노출 70억 회</li><li>국내외 언론 3,000곳 이상</li><li>기업 부스 서비스 안내</li><li>프리미엄 부스</li><li>빈 공간(36㎡부터 판매)</li><li>기업의 시장 전략에 맞춰 다양한 방안을 제공합니다. 더 필요한 사항은 전화로 문의하세요.</li><li>전웨이 국제전시그룹 · 선전 전웨이 국제전람 주소: 선전시 바오안구 푸하이 거리 신허 커뮤니티 바오안대로 6099호 싱강퉁촹후이 톈수동 705-706 전화: 0755-85242014</li></ul></details></figure></main><footer><div class="w"><a href="https://www.chtf.com/">공식 사이트</a> · <a href="https://github.com/PKNU-leejihoon/chtf2026-ko-guide/issues">정보 정정</a></div></footer></body></html>
