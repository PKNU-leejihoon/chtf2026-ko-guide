<figure><a href="https://www.chtf.com/uploads/allimg/202605/3-2605261453315Z.jpg" referrerpolicy="no-referrer" aria-label="원본 이미지 크게 보기"><img src="https://www.chtf.com/uploads/allimg/202605/3-2605261453315Z.jpg" alt="" loading="lazy" referrerpolicy="no-referrer"></a><figcaption>원본 이미지</figcaption><details class="img-text"><summary>사진 속 한글 번역</summary><ul><li>제28회 중국 국제 하이테크 성과 교역회 THE 28th CHINA HI-TECH FAIR</li><li>아시아 태양광·저장·충전 산업전</li><li>2026년 11월 26~28일 선전 국제회의전시센터(바오안)</li><li>주최: 선전시 인민정부 주관: 전웨이 국제전시그룹, 선전 전웨이 국제전람</li><li>고교회: 중국 과학기술 제1전시회</li><li>고교회는 국무원 승인을 거쳐</li><li>1999년부터 27회 열렸으며 중국 첨단기술 분야의 대외 개방</li><li>창구이자 성과 교류·거래 플랫폼으로, 캔톤페어·수입박람회와 함께 중국 3대 국가급 전시회이자 &#x27;중국 과학기술 제1전시회&#x27;로 불립니다.</li><li>전시 면적</li><li>브랜드 참가사</li><li>국가·지역</li><li>전문 관람객</li><li>회 전문 행사</li><li>eVse 아시아 태양광·저장·충전 산업전</li><li>국가 탄소중립 전략과 선전 &#x27;초급속 충전 도시&#x27; 계획이 빠르게 추진되며 태양광·저장·충전 일체형 충전기는 에너지 소비 단말을 넘어 신형 전력 시스템의 유연한 거점이자 교통 저탄소 전환의 모델이 되고 있습니다.</li><li>고교회의 핵심 부문인 이 전시회에는 300곳 이상이 참가해 충전 솔루션, 태양광·저장·충전 일체화, 첨단 충전 기술, 부대시설, 충전소 운영, 충전·교환 솔루션 등 핵심 분야의 기술과 응용 성과를 선보입니다.</li><li>아시아 태양광·저장·충전 산업전의 10대 강점</li><li>》》》 선전은 태양광·저장·충전 산업전을 열기에 세계에서 가장 알맞은 곳입니다 《《《</li><li>선전과 웨강아오의 태양광·저장·충전 역량은 세계 최고 수준입니다. 광둥성 신에너지 산업 클러스터 매출은 1조 위안을 넘어 성의 9번째 1조 위안 클러스터가 됐고, 핵심 부품부터 충전시설까지 전 산업체인을 갖췄습니다. 광둥의 충전 관련 기업은 10.5만 곳 이상으로 전국 1위입니다.</li><li>선전과 웨강아오는 세계 태양광·저장·충전 산업의 집적지로,</li><li>수량과 서비스 범위, 종류 면에서 세계 최대의 충전 인프라를 갖췄으며 세계 신에너지 산업의 핵심 성장축으로 구매 기회가 이어집니다.</li><li>선전과 웨강아오는 국제 태양광·저장·충전 무역</li><li>기지입니다. 광둥의 무역 총액은 40년 연속 전국 1위로 세계 에너지 고도화를 돕습니다.</li><li>선전과 웨강아오는 세계에서 가장 발달한 경제권 중 하나로 광둥의</li><li>GDP는 14조 위안을 넘어 세계 11위 경제 규모에 해당합니다.</li><li>웨강아오 대만구는 세계 3대 만구의 하나로 뉴욕 만구를 넘어 도쿄 만구와 어깨를 나란히 하며 2026년 세계 최대 경제 규모의 만구가 될 전망입니다.</li><li>웨강아오 대만구는 세계 과학기술 고지의 하나로 &#x27;선전-</li><li>홍콩-광저우&#x27; 클러스터는 2026년 세계 100대 혁신 클러스터 1위에 올랐습니다. 선전의 PCT 국제특허 출원은 22년 연속 전국 1위이고 신에너지·충전 첨단기술이 이곳에서 먼저 공개됩니다.</li><li>선전은 상하이와 함께 중국의 2대 경제 중심이자 대외 개방 관문으로, 동남아와 세계로 뻗어 나가며 중국 기업의 해외 진출과 해외 기업의 중국 진입에 가장 알맞은 곳입니다.</li><li>선전은 기업 활력이 넘치는 도시로 국가급 전문화 &#x27;소거인&#x27; 기업이 1,333곳에 달해 전국 도시 1위, 명실상부한 &#x27;전문화·특화 제1도시&#x27;입니다.</li><li>페트로차이나, 시노펙, CNOOC, BYD, 화웨이, CATL 등 세계적 기업이 참여합니다.</li><li>아시아 태양광·저장·충전 산업전은 충전 생태계의 중심으로</li><li>&#x27;일대일로&#x27; 국가와 연계하며 국내외 전문 관람객 45만 명과 만납니다.</li><li>전시구역 구성</li><li>충전 솔루션</li><li>충전기, 충전 모듈, 전원 모듈, 충전 팬터그래프, 충전 스택, 유럽·미국·국제 규격 충전기 제품군</li><li>태양광·저장·충전 일체화</li><li>전기차 태양광·저장·충전·교환소, V2G 기술,</li><li>일체형 솔루션, 마이크로그리드</li><li>첨단 충전 기술</li><li>이동식</li><li>고출력 충전, 초급속 충전, 무선 충전, 이동식 충전,</li><li>차량-충전기 연결, 순차 충전</li><li>부대시설 솔루션</li><li>충전건, 커넥터, 케이블, 하네스, 변압기, 충전 캐비닛, 배전반, 필터, 고저압 보호 장치, 컨버터, 릴레이, 충전기 인증기관, 검사 장비</li><li>충전소 운영 서비스</li><li>충전 플랫폼, 충전소 유지보수, 충전 서비스, 부대시설,</li><li>금융·보험, 충전시설 건설·운영 솔루션, 충전소 배전 설비, 주차장 스마트 감시, 스마트 주차 시스템, 주차 설비, 입체 주차장</li><li>충전·교환 솔루션</li><li>배터리 교환소, 교환 기술·설비, 교환 캐비닛, 교환용 배터리 팩, 교환 모듈, 교환 로봇과 부대 장비</li><li>지난 참가사</li><li>동시 행사</li><li>진좡상(金桩奖)</li><li>중국 충전 운영사 발전 대회</li><li>수익 모델: 충전 운영사</li><li>제10회 진좡상 중국 충전시설 브랜드 시상식</li><li>중국 신에너지차 충전시설 산업 발전 대회 · 중국 신에너지차 충전·교환 생태 해외 진출 기술 서밋 · 중국 충전 운영사 발전 대회</li><li>중국 충전소 투자·융자 대회 · 진좡상 시상식 · 신기술·신제품 첫 공개 로드쇼 · 글로벌 바이어 매칭 대회 · 글로벌 투자·융자 수급 매칭회</li><li>언론 홍보</li><li>온라인 노출 70억 회</li><li>국내외 언론 연중 보도 15,000여 건</li><li>국내외 언론 3,000곳 이상</li><li>기업 부스 서비스 안내</li><li>프리미엄 부스</li><li>빈 공간(36㎡부터 판매)</li><li>위챗 공식 계정</li><li>공식 홈페이지</li><li>기업의 시장 전략에 맞춰 다양한 방안을 제공합니다. 더 필요한 사항은 전화로 문의하세요. 전웨이 국제전시그룹 · 선전 전웨이 국제전람 주소: 선전시 바오안구 푸하이 거리 신허 커뮤니티 바오안대로 6099호 싱강퉁촹후이 톈수동 705-706 전화: 0755-85242014</li></ul></details></figure></main><footer><div class="w"><a href="https://www.chtf.com/">공식 사이트</a> · <a href="https://github.com/PKNU-leejihoon/chtf2026-ko-guide/issues">정보 정정</a></div></footer></body></html>
