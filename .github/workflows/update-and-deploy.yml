name: Deploy service closure notice

on:
  push:
    branches: [main]
    paths:
      - site/index.html
      - site/sw.js
      - .github/workflows/update-and-deploy.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the closure page
        run: |
          mkdir pages
          cp site/index.html site/sw.js pages/
          cp site/index.html pages/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
